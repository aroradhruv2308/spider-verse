<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Face Lab · GNM head generator</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161a22;
    --panel2: #1d222d;
    --text: #e8eaf0;
    --muted: #8a90a0;
    --accent: #e23636; /* spider red */
    --accent2: #2b6cff;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; background: var(--panel);
    border-bottom: 1px solid #262c38;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12.5px; }
  main { flex: 1; display: flex; min-height: 0; }
  #viewport { flex: 1; position: relative; min-width: 0; }
  #viewport canvas { display: block; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 24px; background: rgba(13,15,20,.85);
  }
  #overlay.hidden { display: none; }
  #overlay .big { font-size: 18px; font-weight: 600; }
  #overlay .small { color: var(--muted); max-width: 440px; font-size: 13.5px; }
  aside {
    width: 320px; background: var(--panel); border-left: 1px solid #262c38;
    display: flex; flex-direction: column; min-height: 0;
  }
  .actions { display: flex; gap: 8px; padding: 14px; }
  button {
    flex: 1; padding: 10px 12px; border: 0; border-radius: var(--radius);
    font-weight: 700; font-size: 14px; cursor: pointer; color: #fff;
    transition: transform .06s ease, filter .15s ease;
  }
  button:active { transform: scale(.97); }
  #btn-random { background: var(--accent); }
  #btn-reset  { background: var(--panel2); color: var(--text); font-weight: 600; }
  #btn-download { background: var(--accent2); }
  button:hover { filter: brightness(1.12); }
  .sliders { flex: 1; overflow-y: auto; padding: 0 14px 18px; }
  .group-title {
    position: sticky; top: 0; background: var(--panel);
    padding: 12px 0 6px; font-size: 12px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .slider-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
  .slider-row label {
    width: 108px; flex: none; font-size: 12.5px; color: #c4c9d4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
  footer {
    padding: 8px 18px; font-size: 12px; color: var(--muted);
    background: var(--panel); border-top: 1px solid #262c38;
  }
  footer a { color: var(--accent2); text-decoration: none; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    aside { width: 100%; max-height: 45%; border-left: 0; border-top: 1px solid #262c38; }
  }
</style>
</head>
<body>
<header>
  <h1>FACE <span>LAB</span></h1>
  <div class="sub">random 3D heads · a parametric face model running in your browser</div>
</header>
<main>
  <div id="viewport">
    <div id="overlay">
      <div class="big">Loading head model…</div>
      <div class="small" id="overlay-msg">Fetching model data.</div>
    </div>
  </div>
  <aside>
    <div class="actions">
      <button id="btn-random">🎲 Random face</button>
      <button id="btn-reset">Reset</button>
      <button id="btn-download" title="Download current head as OBJ">⬇ OBJ</button>
    </div>
    <div class="sliders" id="sliders"></div>
  </aside>
</main>
<footer id="footer">
  Drag to orbit, scroll to zoom.
</footer>

<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';

/* ---------------- model loading ----------------
 * gnm_web.bin layout: [4-byte little-endian uint32 = JSON header length][JSON header][payload]
 * Header describes typed arrays by byte offset into the payload:
 *   template  float32 [V*3]
 *   triangles uint32  [T*3]
 *   idBasis   int16   [nId * V*3]   (quantized; dequantize via idScale)
 *   exBasis   int16   [nEx * V*3]
 *   idStd, exStd float32 — per-component standard deviations for sampling
 *   idNames, exNames — optional semantic labels for the first sliders
 */
async function loadModel(url) {
  const buf = await (await fetch(url)).arrayBuffer();
  const headerLen = new DataView(buf).getUint32(0, true);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, headerLen)));
  const base = 4 + headerLen;
  // slice() copies, so sections need no 4-byte alignment in the file
  const view = (spec, Type) => new Type(
    buf.slice(base + spec.offset, base + spec.offset + spec.length * Type.BYTES_PER_ELEMENT));
  return {
    header,
    template:  view(header.template,  Float32Array),
    triangles: view(header.triangles, Uint32Array),
    idBasis:   view(header.idBasis,   Int16Array),
    exBasis:   view(header.exBasis,   Int16Array),
    idStd:     view(header.idStd,     Float32Array),
    exStd:     view(header.exStd,     Float32Array),
    colors:    header.colors ? view(header.colors, Uint8Array) : null,
  };
}

/* ---------------- scene ---------------- */
const viewport = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
viewport.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f14);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdde4ff, 0x33261f, 0.55));
// key light well off the camera axis so facial relief casts readable shading
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(3.0, 2.0, 1.0); scene.add(key);
const fill = new THREE.DirectionalLight(0xaabbff, 0.6); fill.position.set(-1.5, 0.2, 1.5); scene.add(fill);
const rim = new THREE.DirectionalLight(0x6688ff, 0.45); rim.position.set(-2, 0.5, -1.8); scene.add(rim);

function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ---------------- app ---------------- */
const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlay-msg');

let model, mesh, geometry, positions;
let idParams, exParams;

function evaluate() {
  // vertices = template + sum_k idParams[k]*idBasis[k] + sum_k exParams[k]*exBasis[k]
  const n = model.template.length;
  positions.set(model.template);
  const applyBasis = (basis, params, scale) => {
    for (let k = 0; k < params.length; k++) {
      const w = params[k];
      if (w === 0) continue;
      const row = k * n, s = w * scale;
      for (let i = 0; i < n; i++) positions[i] += basis[row + i] * s;
    }
  };
  applyBasis(model.idBasis, idParams, model.header.idScale);
  applyBasis(model.exBasis, exParams, model.header.exScale);
  geometry.attributes.position.needsUpdate = true;
  geometry.computeVertexNormals();
}

const randn = () => {
  // Box-Muller: uniform randoms -> standard normal
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
};
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

function randomFace() {
  for (let k = 0; k < idParams.length; k++)
    idParams[k] = clamp(randn(), -2.5, 2.5) * model.idStd[k];
  for (let k = 0; k < exParams.length; k++)
    exParams[k] = Math.random() < 0.25 ? clamp(randn(), -2, 2) * model.exStd[k] * 0.6 : 0;
  syncSliders(); evaluate();
}
function resetFace() {
  idParams.fill(0); exParams.fill(0);
  syncSliders(); evaluate();
}

/* ---------------- sliders ---------------- */
const slidersEl = document.getElementById('sliders');
const sliderInputs = [];

function buildSliders() {
  const addGroup = (title, params, std, names, prefix) => {
    const h = document.createElement('div');
    h.className = 'group-title'; h.textContent = title;
    slidersEl.appendChild(h);
    const count = Math.min(params.length, 16);
    for (let k = 0; k < count; k++) {
      const row = document.createElement('div'); row.className = 'slider-row';
      const label = document.createElement('label');
      label.textContent = (names && names[k]) || `${prefix} ${k + 1}`;
      const input = document.createElement('input');
      input.type = 'range'; input.min = -3; input.max = 3; input.step = 0.01; input.value = 0;
      input.addEventListener('input', () => {
        params[k] = parseFloat(input.value) * std[k];
        evaluate();
      });
      row.append(label, input); slidersEl.appendChild(row);
      sliderInputs.push({ input, params, std, k });
    }
  };
  addGroup('Identity — who', idParams, model.idStd, model.header.idNames, 'shape');
  addGroup('Expression — doing', exParams, model.exStd, model.header.exNames, 'expr');
}
function syncSliders() {
  for (const s of sliderInputs)
    s.input.value = s.std[s.k] ? s.params[s.k] / s.std[s.k] : 0;
}

/* ---------------- OBJ export ---------------- */
document.getElementById('btn-download').addEventListener('click', () => {
  if (!model) return;
  let out = '# Face Lab export (GNM-derived head)\n';
  for (let i = 0; i < positions.length; i += 3)
    out += `v ${positions[i]} ${positions[i + 1]} ${positions[i + 2]}\n`;
  const t = model.triangles;
  for (let i = 0; i < t.length; i += 3)
    out += `f ${t[i] + 1} ${t[i + 1] + 1} ${t[i + 2] + 1}\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], { type: 'text/plain' }));
  a.download = 'face-lab-head.obj';
  a.click(); URL.revokeObjectURL(a.href);
});

/* ---------------- boot ---------------- */
try {
  model = await loadModel('./model/gnm_web.bin');
  idParams = new Float32Array(model.header.idBasis.components);
  exParams = new Float32Array(model.header.exBasis.components);

  geometry = new THREE.BufferGeometry();
  positions = new Float32Array(model.template.length);
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setIndex(new THREE.BufferAttribute(model.triangles, 1));

  const material = new THREE.MeshStandardMaterial({
    color: model.colors ? 0xffffff : 0xd9b8a3, roughness: 0.55, metalness: 0.02,
    vertexColors: !!model.colors,
    side: THREE.DoubleSide,   // robust against seam/pole winding quirks
  });
  if (model.colors) {
    const c = new Float32Array(model.colors.length);
    for (let i = 0; i < c.length; i++) c[i] = model.colors[i] / 255;
    geometry.setAttribute('color', new THREE.BufferAttribute(c, 3));
  }
  mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  // frame the head
  evaluate();
  geometry.computeBoundingSphere();
  const bs = geometry.boundingSphere;
  controls.target.copy(bs.center);
  // 3/4 view reads facial depth far better than a dead-on frontal
  const az = 14 * Math.PI / 180, d = bs.radius * 4.0;
  camera.position.set(bs.center.x + Math.sin(az) * d, bs.center.y + bs.radius * 0.12,
                      bs.center.z + Math.cos(az) * d);
  camera.near = bs.radius / 50; camera.far = bs.radius * 50;
  camera.updateProjectionMatrix();

  buildSliders();
  randomFace();
  overlay.classList.add('hidden');

  document.getElementById('footer').innerHTML =
    (model.header.source === 'placeholder'
      ? 'Model: procedural placeholder head (same file format as ' +
        '<a href="https://github.com/google/GNM" target="_blank" rel="noopener">Google\'s GNM</a> — ' +
        'drop in a GNM-baked <code>gnm_web.bin</code> to upgrade). '
      : 'Model: <a href="https://github.com/google/GNM" target="_blank" rel="noopener">GNM — ' +
        'Generative aNthropomorphic Model</a> (Google, Apache-2.0), compressed for the web. ') +
    'Drag to orbit, scroll to zoom.';
} catch (err) {
  overlayMsg.textContent =
    'Could not load model/gnm_web.bin — the baked GNM data is missing from this deployment. ' +
    '(' + err.message + ')';
  console.error(err);
}

resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// handle for tests/tools (harmless in production)
window.__facelab = {
  camera, controls, scene,
  get geometry() { return geometry; },
  get model() { return model; },
  get center() { return geometry?.boundingSphere?.center; },
  get radius() { return geometry?.boundingSphere?.radius; },
};

document.getElementById('btn-random').addEventListener('click', randomFace);
document.getElementById('btn-reset').addEventListener('click', resetFace);
</script>
</body>
</html>
